[project]
name = "PlexAPI"
authors = [
    { name = "Michael Shepanski", email = "michael.shepanski@gmail.com" },
]
description = "Python bindings for the Plex API."
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["api", "plex"]
license = "BSD-3-Clause"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests"]
dynamic = ["version"]

[project.optional-dependencies]
alert = ["websocket-client>=1.3.3"]
jwt = ["pyjwt[crypto]"]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pillow",
    "pyjwt[crypto]",
    "pytest",
    "pytest-cache",
    "pytest-cov",
    "pytest-mock",
    "recommonmark",
    "requests-mock",
    "sphinx",
    "sphinx-rtd-theme",
    "tqdm",
    "websocket-client",
]

[project.urls]
Homepage = "https://github.com/pushingkarmaorg/python-plexapi"
Documentation = "https://python-plexapi.readthedocs.io"

[tool.setuptools.dynamic]
version = { attr = "plexapi.const.__version__" }

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "anonymously: test plexapi anonymously.",
    "authenticated: test plexapi authenticated.",
    "client: this is a client test.",
    "req_client: require a client to run this test.",
]

[tool.isort]
profile = "black"
line_length = 99
combine_as_imports = true
force_grid_wrap = 2

[tool.black]
line_length = 99

#[tool.mypy]
#### Suggested path to full typing
# Start off with these
#warn_unused_configs = true
#warn_redundant_casts = true
#warn_unused_ignores = true

# Getting this passing should be easy
#strict_equality = true

# Strongly recommend enabling this one as soon as you can
#check_untyped_defs = true

# These shouldn't be too much additional work, but may be tricky to
# get passing if you use a lot of untyped libraries
#disallow_subclassing_any = true
#disallow_untyped_decorators = true
#disallow_any_generics = true

# These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true

# This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true

# This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

# This one is a catch-all flag for the rest of strict checks that are technically
# correct but may not be practical
#extra_checks = true

#### Target config
#warn_no_return = true
#warn_unreachable = true
#strict = true
#allow_subclassing_any = true
